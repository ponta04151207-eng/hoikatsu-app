name: 空き数を更新する

on:
  schedule:
    - cron: '0 1 1,15 * *'   # 毎月1日と15日の 日本時間10:00
  workflow_dispatch:           # 手動でも動かせる(Actionsタブの「Run workflow」)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 区のページから空き数を取得する(合計が合わなければここで失敗して止まる)
        run: python3 update_now.py
      - name: 変わっていれば保存する
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "空き数を更新"
            git push
          else
            echo "変更なし"
          fi
